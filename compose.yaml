services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims_local
      POSTGRES_DB: claims
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - claims-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  claims-data:
